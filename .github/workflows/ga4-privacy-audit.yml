name: Isolated GA4 privacy runtime audit
on:
  pull_request:
    paths:
      - '.qa/**'
      - '.github/workflows/ga4-privacy-audit.yml'
permissions:
  contents: read
jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --ignore-scripts playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node .qa/runtime.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ga4-runtime-audit
          path: runtime-audit.json
          retention-days: 7
