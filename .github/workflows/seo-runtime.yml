name: Isolated SEO content audit
on:
  push:
    branches: [qa/seo-six-services-20261109]
permissions:
  contents: read
jobs:
  runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --ignore-scripts playwright@1.56.1
      - run: npx playwright install --with-deps chromium webkit
      - run: node .qa/seo-runtime.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: seo-runtime-audit
          path: |
            seo-audit.json
            seo-*.png
          retention-days: 7
